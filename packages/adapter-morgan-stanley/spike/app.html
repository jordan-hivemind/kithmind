<!doctype html>
<meta charset="utf-8">
<title>fake signed-in app</title>
<h1>fake signed-in app</h1>
<pre id="out">loading</pre>
<script>
  // Stands in for the institution's SPA: it mints its own XSRF token and
  // device footprint and attaches them to every XHR via setRequestHeader.
  // Nothing outside the page can reconstruct them. It also mints a bearer for
  // its documents calls and sends those with fetch, not XHR -- the second
  // mechanism the bridge's hook has to cover.
  const xsrf = "xsrf-" + Math.random().toString(36).slice(2);
  const footprint = "fp-" + Math.random().toString(36).slice(2);
  const bearer = "Bearer tok-" + Math.random().toString(36).slice(2);

  function appXhr(path) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", path);
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.setRequestHeader("X-XSRF-TOKEN", xsrf);
      xhr.setRequestHeader("X-DEVICE-FOOTPRINT", footprint);
      xhr.onload = () => resolve(xhr.status + " " + xhr.responseText);
      xhr.onerror = reject;
      xhr.send("{}");
    });
  }

  async function appDocumentsFetch() {
    const response = await fetch("/api/documents", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-XSRF-TOKEN": xsrf,
        Authorization: bearer,
      },
      body: "{}",
    });
    return response.status + " " + (await response.text());
  }

  appXhr("/api/activity").then((text) => {
    // What the server saw on the app's own request. The spike compares its
    // page-context fetch against this.
    window.__onLoadEcho = text;
    document.getElementById("out").textContent = text;
  });

  // Stands in for the app's own Documents page loading: this is the only call
  // that carries the bearer.
  appDocumentsFetch().then((text) => {
    window.__documentsEcho = text;
  });
</script>
