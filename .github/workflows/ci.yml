name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  parser-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.2"
      - run: PYTHONPATH=evals/parser/src python3 -m unittest discover -s evals/parser/tests -p 'test_*.py'
      - run: uv run --frozen --only-group fixture python generate_fixtures.py
        working-directory: evals/parser
      - run: uv run --frozen --only-group fixture python test_fixtures.py
        working-directory: evals/parser
      - run: git diff --exit-code -- evals/parser/fixtures
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test:once
      - run: pnpm build

  postgres-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/postgres-proof test:integration
