name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new head supersedes older CI for the same pull request. Main pushes keep
# distinct groups and never cancel one another, so every merged commit is
# still verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parser-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.2"
      - run: PYTHONPATH=evals/parser/src python3 -m unittest discover -s evals/parser/tests -p 'test_*.py'
      - run: uv run --frozen --only-group fixture python generate_fixtures.py
        working-directory: evals/parser
      - run: uv run --frozen --only-group fixture python test_fixtures.py
        working-directory: evals/parser
      - run: git diff --exit-code -- evals/parser/fixtures
  verify:
    runs-on: ubuntu-latest
    # The finance archive's Postgres tests skip when no database is configured,
    # so without this service they would never run anywhere. A skipped test is
    # not a passing one.
    services:
      postgres:
        # pgvector, not plain postgres: migration 015 creates the `vector`
        # extension, so the brain schema does not apply on an image that
        # lacks it. Same server version, same env, same health check.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      FINANCE_ARCHIVE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Turns skipping into a failure inside the test files themselves. A
      # public clone sets neither variable and still skips cleanly; here a
      # skip would mean the database never reached the task, which looks
      # exactly like a green run.
      FINANCE_ARCHIVE_REQUIRE_DATABASE: "1"
      # The brain schema's own suite, against the same server. It creates a
      # throwaway database per file and drops it, so `kith` and `finance` are
      # applied side by side for real rather than in a renamed schema.
      KITH_STORE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      KITH_STORE_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm check-types
      # The backup engine's integration test (scripts/*.integration.test.mjs)
      # shells out to pg_dump and pg_restore, which refuse a server whose major
      # version is newer than their own. The runner image ships the 16 client;
      # the service above is 17. Install the matching client so the test runs
      # here rather than skipping on the mismatch it would otherwise report.
      # Ubuntu's own archive stops at 16, so the client comes from the
      # PostgreSQL project's apt repository, keyed by its published signing key.
      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
      # Each test file applies the whole kith schema in one transaction
      # (about 2,100 locks), and the kith-store and web suites run files in
      # parallel against this server. The default lock table (64 x 100 slots)
      # fits about three applies, so raise it. A service container cannot take
      # server flags, and the setting only applies at server start, hence
      # ALTER SYSTEM and a restart. See docs/self-hosting.md.
      - name: Raise the test server's lock table
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres \
            -c "ALTER SYSTEM SET max_locks_per_transaction = 1024"
          docker restart ${{ job.services.postgres.id }}
          until pg_isready -h localhost -p 5432; do sleep 1; done
          test "$(psql postgres://postgres:postgres@localhost:5432/postgres -tAc 'SHOW max_locks_per_transaction')" = 1024
      # No log scraping. FINANCE_ARCHIVE_REQUIRE_DATABASE above makes each
      # suite that needs a database fail to load rather than skip when the URL
      # is missing, so the guarantee lives in the tests instead of in a grep
      # over another tool's console output, which can silently stop asserting.
      - run: pnpm test:once
      - run: pnpm build

  # Named for the prototype this package grew out of and kept that way on
  # purpose: branch protection gates merges on this job name. The package it
  # runs is @repo/kith-store (P2-39a).
  postgres-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/kith-store test:integration
      # P2-39b's loader shells out to `psql \copy` (plan section 3 step 4)
      # rather than add a pg-copy-streams dependency; ubuntu-latest ships it,
      # but pin the install so a runner image change cannot silently drop it.
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm --filter @repo/kith-migrate test:integration
