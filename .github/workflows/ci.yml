name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  parser-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.2"
      - run: PYTHONPATH=evals/parser/src python3 -m unittest discover -s evals/parser/tests -p 'test_*.py'
      - run: uv run --frozen --only-group fixture python generate_fixtures.py
        working-directory: evals/parser
      - run: uv run --frozen --only-group fixture python test_fixtures.py
        working-directory: evals/parser
      - run: git diff --exit-code -- evals/parser/fixtures
  verify:
    runs-on: ubuntu-latest
    # The finance archive's Postgres tests skip when no database is configured,
    # so without this service they would never run anywhere. A skipped test is
    # not a passing one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      FINANCE_ARCHIVE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test:once | tee /tmp/test-once.log
      # The Postgres tests skip when no database is configured, which is what
      # lets a public clone run the suite. In CI a database IS configured, so a
      # skip means the variable never reached the task and the tests silently
      # did not run. Fail rather than pass on a check that did not execute.
      - name: Fail if the finance Postgres tests were skipped
        run: |
          # Turbo emits the task name as a group header and then bare summary
          # lines, so scope the search to that group rather than matching the
          # task name on the same line as the count.
          skipped=$(awk '/@repo\/finance-archive:test:once/{f=1} f && /skipped [0-9]+$/{print $NF; exit}' /tmp/test-once.log)
          echo "finance-archive skipped: ${skipped:-unparsed}"
          if [ -z "$skipped" ]; then
            echo "::error::could not read the finance skipped count; the assertion cannot verify anything"
            exit 1
          fi
          if [ "$skipped" != "0" ]; then
            echo "::error::finance Postgres tests were skipped in CI; FINANCE_ARCHIVE_DATABASE_URL did not reach the task"
            exit 1
          fi
      - run: pnpm build

  postgres-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/postgres-proof test:integration
